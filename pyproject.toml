[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-gateway"
version = "1.4.0"
description = "Managed Telegram sessions, live queues, and bounded history."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "telethon==1.45.0",
    "ftfy>=6.0",
    "emoji>=2.1.0",
    "python-ulid>=3.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.1",
]

[project.scripts]
telegram-login = "telegram_gateway.login:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["telegram_gateway*"]

[tool.setuptools.package-data]
telegram_gateway = ["py.typed"]
